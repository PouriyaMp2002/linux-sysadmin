# Forward system logs to ALL servers (web01, storage01, backup01)
# Destination: ops01 (10.0.2.13)
# Transport: TCP 514
# Directory: /etc/rsyslog.d

*.* action(
    type="omfwd"

    target="10.0.2.13"
    port="514"
    protocol="tcp"

    action.resumeRetryCount="-1"

    queue.type="LinkedList"
    queue.filename="remoteForward"
    queue.maxDiskSpace="100m"
    queue.saveOnShutdown="on"
    queue.size="10000"
)