# Collect Nginx log files from web01.
# Directory: /etc/rsyslog.d

module(load="imfile")

input(
    type="imfile"
    File="/var/log/nginx/company-portal-access.log"

    Tag="nginx-access:"
    Severity="info"
    Facility="local6"

    PersistStateInterval="100"
)

input(
    type="imfile"
    File="/var/log/nginx/company-portal-error.log"

    Tag="nginx-error:"
    Severity="error"
    Facility="local6"

    PersistStateInterval="100"
)