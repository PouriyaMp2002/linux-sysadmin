# Centralized syslog receiver
# Server: ops01
# Protocol: TCP
# Port: 514
# Directory: /etc/rsyslog.d

module(load="imtcp")

ruleset(name="RemoteRules") {

    # -------------------------------------
    # WEB01 - 10.0.2.11
    # -------------------------------------

    if ($fromhost-ip == "10.0.2.11") then {

        if ($syslogtag startswith "nginx-access:") then {
            action(
                type="omfile"
                file="/var/log/remote/web01/nginx-access.log"
                createDirs="on"
            )
            stop
        }

        if ($syslogtag startswith "nginx-error:") then {
            action(
                type="omfile"
                file="/var/log/remote/web01/nginx-error.log"
                createDirs="on"
            )
            stop
        }

        if ($syslogtag startswith "company-portal:") then {
            action(
                type="omfile"
                file="/var/log/remote/web01/company-portal.log"
                createDirs="on"
            )
            stop
        }

        action(
            type="omfile"
            file="/var/log/remote/web01/system.log"
            createDirs="on"
        )
        stop
    }

    # -------------------------------------
    # STORAGE01 - 10.0.2.12
    # -------------------------------------

    if ($fromhost-ip == "10.0.2.12") then {

        if ($syslogtag startswith "company-backup:") then {
            action(
                type="omfile"
                file="/var/log/remote/storage01/backup.log"
                createDirs="on"
            )
            stop
        }

        if (
            $syslogtag startswith "nfs-" or
            $syslogtag startswith "rpc.mountd" or
            $syslogtag startswith "rpc.nfsd"
        ) then {
            action(
                type="omfile"
                file="/var/log/remote/storage01/nfs.log"
                createDirs="on"
            )
            stop
        }

        action(
            type="omfile"
            file="/var/log/remote/storage01/system.log"
            createDirs="on"
        )
        stop
    }

    # -------------------------------------
    # BACKUP01 - 10.0.2.14
    # -------------------------------------

    if ($fromhost-ip == "10.0.2.14") then {

        if (
            $syslogfacility-text == "auth" or
            $syslogfacility-text == "authpriv"
        ) then {
            action(
                type="omfile"
                file="/var/log/remote/backup01/ssh.log"
                createDirs="on"
            )
            stop
        }

        action(
            type="omfile"
            file="/var/log/remote/backup01/system.log"
            createDirs="on"
        )
        stop
    }

    # Messages from unexpected source IPs
    # are not written to the remote log tree.
    stop
}

input(
    type="imtcp"
    port="514"
    ruleset="RemoteRules"
)